server:
  port: 8084

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      mvc:
        routes:
          - id: USER-SERVICE
            uri: lb://USER-SERVICE
            predicates:
              - Path= /user/**

          - id: RATING-SERVICE
            uri: lb://RATING-SERVICE
            predicates:
              - Path= /ratings/**

          - id: HOTEL-SERVICE
            uri: lb://HOTEL-SERVICE
            predicates:
              - Path= /hotel/**,/staff/**

