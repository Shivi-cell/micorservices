targetCompatibility = JavaVersion.VERSION_16
sourceCompatibility = JavaVersion.VERSION_16
plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.1'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.user.service'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2023.0.3")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// dependency for eureka client
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	// dependency for feign client
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// dependency for spring cloud config
	implementation 'org.springframework.cloud:spring-cloud-starter-config'

	// dependency for actuator to monitor the health of the servers
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// dependency for AOP to send the matrix to actuators
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// dependency for Resilience4j to implement the spring cloud circuit breaker
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j:8.0.32'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
