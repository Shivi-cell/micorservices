server:
  port: 8081

spring:
  application:
    name: USER-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/microservices
    username : root
    password : password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
#    to import the configuration form the github(config server)
  config:
    import: configserver:http://localhost:8085


#    the dialect is auto detected so you don't need to specify it explicitly
